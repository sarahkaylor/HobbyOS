# tests/fixtures/abi/WAVE.CFG — GB-070 W0-corpus manifest (the wave list as DATA).
#
# The boot wave's program list is data, not the 97 literal calls in main.c.
# This manifest names the W0 corpus members (hello/cat/sh/ls — the M1 gate's
# corpus, gaming.md §7) plus the device-probe fixture T4PROBE.  A wave that is
# supposed to be a *W0 corpus run* must dispatch exactly these and each must
# print its own arrival line; a manifest naming a file absent from disk.img must
# FAIL the tier (never a silent ignore).  The default boot (no manifest) keeps
# the existing 97-program list — a manifest only ADDS a required-set contract.
#
# Consumed by tools/gate/t4_wave.sh --manifest @<this file>; the gate FAILs when
# any member above is missing from the wave's exited-programs set.  One member
# per line, `#` comments, blank lines skipped.  No kernel change required to
# name a new member — that is the point of doing the corpus as data.
#
# W0 corpus (static-musl): hello/cat/sh/ls/coreutils-static
HELLO.BIN
CAT.BIN
SH.BIN
LS.BIN
W0PIE.BIN
#
# T4PROBE.BIN is deliberately NOT named here yet. It was, and t4_wave.sh
# correctly reported "staged/requested but never ran" -- so I checked whether it
# could run, and it cannot, for a reason worth recording:
#
#   obj/intel/t4_probe.elf is ET_EXEC at 0x401c18 (musl -static).
#     * as a flat .bin the v2 loader takes the FLAT path (no ELF header) and
#       executes image byte 0 -- measured: kernel #UD, vector=6,
#       rip=0x798FA021, guest dead at 189 console lines;
#     * as an ELF the loader REFUSES it by design: "ET_EXEC linked below the
#       user window; a -static-pie build is required".
#
# So the probe needs `musl-gcc -static-pie` (ET_DYN, no PT_INTERP), which the
# loader accepts -- proven with a musl static-pie fixture, entry 0x1000001000,
# 4 PT_LOAD mapped. But a musl static-pie carries R_X86_64_RELATIVE relocations
# and elf_loader.c applies NONE (grep -c reloc -> 0), so it would enter and then
# fault at the first GOT dereference.
#
# Naming it here before that lands makes the gate red for a reason nobody can
# fix at the manifest: the expected dispatch is impossible. Put it back the
# moment (a) the probe is built -static-pie and (b) the loader applies
# R_X86_64_RELATIVE -- then this file is a one-line change again, which is the
# point of the corpus being data.
#

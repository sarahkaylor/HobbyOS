# Meson cross file: HobbyOS arm (aarch64-none-elf).
# Use together with the generated constants file (written by cross/env.sh):
#   meson setup --cross-file <tools>/meson-paths.ini --cross-file third_party/x11/cross/meson-arm.ini ...
# The compilers are cross/env.sh's wrappers: compile = clang --target + the
# repo's USER_CFLAGS model; link = static flat-image closure (crt0.o + libc.a
# [+ libcxx.a] + -T src/user/linker.ld), so meson's sanity check links.
# system = 'hobbyos' (not 'linux'): nothing Linux-specific should be assumed;
# packages that branch on host_machine.system() get explicit -D options.

[binaries]
c = hb_tools / 'hobbyos-cc'
cpp = hb_tools / 'hobbyos-c++'
ar = 'llvm-ar'
nm = 'llvm-nm'
strip = 'llvm-strip'
objcopy = 'llvm-objcopy'
pkg-config = hb_tools / 'hobbyos-pkg-config'
pkgconfig = hb_tools / 'hobbyos-pkg-config'

[built-in options]
c_args = ['-O2', '-g', '-fno-common', '-I' + hb_prefix / 'include']
cpp_args = ['-O2', '-g', '-std=c++17', '-I' + hb_prefix / 'include']
c_link_args = ['-L' + hb_prefix / 'lib']
cpp_link_args = ['-L' + hb_prefix / 'lib']
default_library = 'static'
prefix = hb_prefix

[properties]
needs_exe_wrapper = true
pkg_config_libdir = [hb_prefix / 'lib/pkgconfig', hb_prefix / 'share/pkgconfig']

[host_machine]
system = 'hobbyos'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'

name: mac-ci
on: [push, workflow_dispatch]

concurrency:
  group: mac-ci-main
  cancel-in-progress: false

env:
  # `.mac-ci-shim` provides a `gcc` that routes bare-metal ELF links to ld.lld
  # (clang delegates x86_64-none-elf links to gcc; /usr/bin/gcc is Apple clang
  # and would emit Mach-O args). gnubin provides GNU mktemp/stat/timeout.
  PATH: /Users/sarah/.mac-ci-shim:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:/opt/homebrew/opt/llvm/bin:/usr/bin:/bin:/usr/sbin:/sbin

jobs:
  arm:
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: 'Build + run all ARM tiers (host golden, kernel unit, desktop, integration)'
        run: |
          # Tier 1: native host golden tests (no QEMU, seconds)
          make host_tests
          # Tier 2: kernel unit tests (20s-bounded, greps UNIT TESTS PASSED/FAILED)
          ./run_unit_tests.sh
          # Tier 3: automated desktop/framebuffer test (self-shuts down)
          make desktop_test
          # Tier 3: userland integration suite (boots MODE=test, halts QEMU)
          make test
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm-logs
          path: |
            qemu.log
            *.log
            desktop_test*.png
          if-no-files-found: ignore

  intel:
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: x64 kernel unit tests (reliable x64 gate)
        run: ./run_unit_tests_intel.sh
      - name: x64 userland integration (known-flaky under TCG; 45m cap, non-blocking)
        continue-on-error: true
        run: timeout 2700 make test_intel
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-logs
          path: |
            qemu.log
            *.log
          if-no-files-found: ignore
name: mac-ci
on:
  push:
  workflow_dispatch:
  # Nightly: the ARM integration tier runs ~30 min, longer than the gap
  # between pushes during active waves (superseded runs get cancelled to free
  # the single runner), so give the full battery a quiet window.
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: mac-ci-main
  cancel-in-progress: false

env:
  # `.mac-ci-shim` provides a `gcc` that routes bare-metal ELF links to ld.lld
  # (clang delegates x86_64-none-elf links to gcc; /usr/bin/gcc is Apple clang
  # and would emit Mach-O args). System tools stay Apple's own: the build
  # scripts switch on `uname -s` and expect BSD stat/mktemp semantics.
  PATH: /Users/sarah/.mac-ci-shim:/opt/homebrew/bin:/opt/homebrew/sbin:/opt/homebrew/opt/llvm/bin:/usr/bin:/bin:/usr/sbin:/sbin
  # The in-OS LLVM toolchain staging (tools-staged) is a multi-hour cold build
  # and none of the test tiers use /TOOLS. Skip it when absent; a persisted
  # staging (third_party/llvm-21.1.8/dist-staging) is still used when present.
  TOOLS_SKIP: "1"
  # TCG (no KVM on Apple Silicon) boots slower than the 30 s default.
  DESKTOP_TEST_TIMEOUT: "120"

jobs:
  # Host golden tests: this tier carries the remaining macOS porting debt
  # (glibc-only *_l locale APIs, C++ header internals, freshly landed wave
  # tests). Non-blocking until that port lands; failures stay visible in the
  # run annotations and uploaded logs.
  host-tests:
    runs-on: [self-hosted, mac-studio]
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Host golden tests (macOS porting debt tracker)
        run: make host_tests
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-host-logs
          path: |
            *.log
          if-no-files-found: ignore

  arm:
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ARM kernel unit tests (20s-bounded)
        run: ./run_unit_tests.sh
      - name: Automated desktop/framebuffer test (guest hangs at current tip — non-blocking)
        continue-on-error: true
        run: make desktop_test
      - name: Reap stale QEMU before the integration tier
        if: always()
        run: |
          # The quarantined desktop_test can leave a frozen guest holding
          # disk.img; the T3 harness then refuses to start ("in use by another
          # QEMU") and reports an environment failure instead of a tier result.
          pkill -f 'qemu-system-aarch64' 2>/dev/null || true
          pkill -f 'qemu-system-x86_64' 2>/dev/null || true
          sleep 2
      - name: ARM userland integration suite
        run: make test
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm-logs
          path: |
            qemu.log
            *.log
            desktop_test*.png
          if-no-files-found: ignore

  intel:
    runs-on: [self-hosted, mac-studio]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: x64 build gate (kernel + disk image for the unit tier)
        run: make ARCH=intel MODE=unit_tests hobbyos.elf disk.img
      - name: x64 kernel unit tests (QEMU x86_64 under TCG; non-blocking until the TCG boot gap is fixed)
        continue-on-error: true
        run: timeout 2700 ./run_unit_tests_intel.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-intel-logs
          path: |
            qemu.log
            build.log
            *.log
          if-no-files-found: ignore